# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃            Window Rules                    ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# ── Floating ─────────────────────────────────
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(thunar)$, title:^(File Operation Progress)$
windowrulev2 = float, class:^(thunar)$, title:^(Confirm)$
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = float, title:^(Open File)$
windowrulev2 = float, title:^(Save As)$
windowrulev2 = float, class:^(imv)$
windowrulev2 = float, class:^(mpv)$

# ── Size Constraints ─────────────────────────
windowrulev2 = size 800 600, class:^(pavucontrol)$
windowrulev2 = size 800 600, class:^(blueman-manager)$

# ── Opacity ──────────────────────────────────
windowrulev2 = opacity 0.92 0.88, class:^(kitty)$
windowrulev2 = opacity 0.92 0.88, class:^(thunar)$
windowrulev2 = opacity 0.95 0.90, class:^(code-url-handler)$
windowrulev2 = opacity 0.95 0.90, class:^(Code)$

# ── Workspace Assignments ────────────────────
windowrulev2 = workspace 2, class:^(firefox)$
windowrulev2 = workspace 2, class:^(brave-browser)$
windowrulev2 = workspace 3, class:^(code-url-handler)$
windowrulev2 = workspace 4, class:^(thunar)$
windowrulev2 = workspace 5, class:^(Spotify)$
windowrulev2 = workspace 5, class:^(spotify)$

# ── Layer Rules ──────────────────────────────
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blur, wofi
layerrule = ignorezero, wofi
