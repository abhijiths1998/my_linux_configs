# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃            Window Rules                    ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# ── Floating ─────────────────────────────────
windowrule {
    name = float-pavucontrol
    match:class = ^pavucontrol$
    float = true
    size = 800 600
}

windowrule {
    name = float-blueman
    match:class = ^blueman-manager$
    float = true
    size = 800 600
}

windowrule {
    name = float-nm-connection-editor
    match:class = ^nm-connection-editor$
    float = true
}

windowrule {
    name = float-thunar-progress
    match:class = ^thunar$
    match:title = File Operation Progress
    float = true
}

windowrule {
    name = float-thunar-confirm
    match:class = ^thunar$
    match:title = ^Confirm
    float = true
}

windowrule {
    name = float-pip
    match:title = ^Picture-in-Picture$
    float = true
}

windowrule {
    name = float-open-file
    match:title = ^Open File$
    float = true
}

windowrule {
    name = float-save-as
    match:title = ^Save As$
    float = true
}

windowrule {
    name = float-imv
    match:class = ^imv$
    float = true
}

windowrule {
    name = float-mpv
    match:class = ^mpv$
    float = true
}

# ── Opacity (browsers/video stay fully opaque) ──
windowrule {
    name = opaque-firefox
    match:class = ^firefox$
    opacity = 1.0 1.0
}

windowrule {
    name = opaque-brave
    match:class = ^brave-browser$
    opacity = 1.0 1.0
}

windowrule {
    name = opaque-zen
    match:class = ^zen$
    opacity = 1.0 1.0
}

windowrule {
    name = opaque-mpv
    match:class = ^mpv$
    opacity = 1.0 1.0
}

windowrule {
    name = opaque-pip
    match:title = ^Picture-in-Picture$
    opacity = 1.0 1.0
}

# ── Workspace Assignments ─────────────────────
windowrule {
    name = ws-browser
    match:class = ^(firefox|brave-browser)$
    workspace = 2
}

windowrule {
    name = ws-code
    match:class = ^code-url-handler$
    workspace = 3
}

windowrule {
    name = ws-files
    match:class = ^thunar$
    workspace = 4
}

windowrule {
    name = ws-spotify
    match:class = ^[Ss]potify$
    workspace = 5
}

# ── Layer Rules ──────────────────────────────
layerrule {
    name = blur-waybar
    match:namespace = waybar
    blur = true
}

layerrule {
    name = blur-wofi
    match:namespace = wofi
    blur = true
}

layerrule {
    name = blur-notifications
    match:namespace = notifications
    blur = true
}

layerrule {
    name = blur-launcher
    match:namespace = launcher
    blur = true
}
