# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃              Hyprlock                     ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

general {
    disable_loading_bar = false
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    brightness = 0.5
    contrast = 1.0
    vibrancy = 0.2
}

# ── Clock ─────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(220, 220, 220, 1.0)
    font_size = 72
    font_family = JetBrains Mono
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(180, 180, 180, 0.9)
    font_size = 18
    font_family = JetBrains Mono
    position = 0, 20
    halign = center
    valign = center
}

# ── Password Input ────────────────────────────
input-field {
    monitor =
    size = 280, 52
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.2
    outer_color = rgba(200, 200, 200, 0.3)
    inner_color = rgba(20, 20, 20, 0.8)
    font_color = rgba(220, 220, 220, 1.0)
    fade_on_empty = true
    placeholder_text = <i>Enter password...</i>
    hide_input = false
    check_color = rgb(204, 136, 34)
    fail_color = rgb(204, 34, 34)
    fail_text = <i>Wrong password ($ATTEMPTS attempts)</i>
    capslock_color = rgb(204, 136, 34)
    position = 0, -60
    halign = center
    valign = center
}
