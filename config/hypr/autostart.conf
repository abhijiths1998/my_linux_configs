# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃              Autostart                     ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# ── Wallpaper ────────────────────────────────
exec-once = awww-daemon
exec-once = sleep 0.5 && ~/my_linux_configs/scripts/wallpaper.sh --random

# ── Bar ──────────────────────────────────────
exec-once = waybar

# ── Notifications ────────────────────────────
exec-once = dunst

# ── Polkit ───────────────────────────────────
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# ── Clipboard ────────────────────────────────
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ── Cursor ───────────────────────────────────
exec-once = hyprctl setcursor Bibata-Modern-Classic 24

# ── Idle ─────────────────────────────────────
exec-once = hypridle

# ── GTK ──────────────────────────────────────
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'adw-gtk3-dark'
exec-once = gsettings set org.gnome.desktop.interface icon-theme 'Papirus-Dark'
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Bibata-Modern-Classic'
exec-once = gsettings set org.gnome.desktop.interface font-name 'JetBrains Mono 11'

# Hyprland Monitor Manager - Auto-manage displays and lid
exec-once = hmonitor daemon
